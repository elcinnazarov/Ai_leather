version: '3.8'

services:

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: aiatelye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # =========================
  # RABBITMQ
  # =========================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # =========================
  # MINIO
  # =========================
  minio:
    image: minio/minio:latest
    container_name: ecommerce-object-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  # =========================
  # SPRING BOOT BACKEND
  # =========================
  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aiatelye-backend:1.0.0 # 👈 Həmişə sabit və dəqiq versiya!
    container_name: aiatelye-backend
    restart: unless-stopped
    # ✅ ƏLAVƏ EDİLDİ: Bütün .env açarlarını (Payriff, URLs, Mail) birbaşa Spring Boot-a ötürür
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${BACKEND_DB_NAME}   # 👈 ƏVƏ EDİLDİ: Backend bu bazanı oxuyacaq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MINIO_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ecommerce-network

  # =========================
  # FRONTEND
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiatelye-frontend
    restart: unless-stopped
    networks:
      - ecommerce-network

  # =========================
  # N8N
  # =========================
  n8n:
    image: n8nio/n8n:latest
    container_name: aiatelye-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${DB_USERNAME}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_HOST: n8n.e1000leather.com
      N8N_EDITOR_BASE_URL: https://n8n.e1000leather.com
      WEBHOOK_URL: https://n8n.e1000leather.com
      N8N_PROXY_HOPS: 1
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      GENERIC_TIMEZONE: Asia/Baku
      N8N_SECURE_COOKIE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  # =========================
  # NGINX (Reverse Proxy & SSL)
  # =========================
  nginx:
    image: nginx:alpine
    container_name: aiatelye-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - n8n
      - minio
    networks:
      - ecommerce-network

# =========================
# VOLUMES
# =========================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  n8n_data:

# =========================
# NETWORK
# =========================
networks:
  ecommerce-network:
    driver: bridge