spring:
  messages:
    basename: i18n/messages/messages
    encoding: UTF-8

  application:
    name: Aiatelye

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      minimum-idle: 3
      maximum-pool-size: 8
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      enabled: true
      max-file-size: 6MB
      max-request-size: 30MB

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_username}
    password: ${RABBITMQ_password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3
          max-interval: 10s

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 6000ms

  app:
    frontend-url: ${FRONTEND_URL}
    currency:
      rates:
        usd-to-azn: "1.70"
        eur-to-azn: "1.9765"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  google:
    client:
      id: ${GOOGLE_CLIENT_ID}

server:
  port: 8080

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

minio:
  url: ${MINIO_URL}
  puclicurl: ${MINIOPUBLIC_URL}
  access-key: ${MINIO_ADMIN}
  secret-key: ${SECRET_ADMIN}
  bucket: ai-atelye-storage
  image:
    allowed-extensions: jpg,jpeg,png,webp
    max-size-mb: 5
  folders:
    product: products
    leather: leather-textures
    ai: ai-renders

ai:
  callback:
    secret: ${AI_CALLBACK_SECRET}

app:
  backend-url: ${BACKEND_URL}
  frontend-url: ${FRONTEND_URL}
  geoip:
    database-path: classpath:GeoLite2-Country.mmdb

currency:
  rates:
    usd-to-azn: "1.70"
    eur-to-azn: "1.9765"

jwt:
  secret: ${JWT_SECRET_KEY}

payriff:
  base-url: https://api.payriff.com/api/v3
  merchant-id: ${PAYRIFF_MERCHANT_ID}
  secret-key: ${PAYRIFF_SECRET_KEY}
  callback-token: ${PAYRIFF_CALLBACK_TOKEN}
  callback-url: ${app.backend-url}/api/internal/payriff-callback

cache:
  redis:
    account:
      ttl: 120
    price:
      ttl: 12
    product-list:
      ttl: 30
    product-detail:
      ttl: 1440
    leather:
      ttl: 10
    grade:
      ttl: 60
    orderIdempotency:
      ttl: 30
    design:
      ttl: 86400
      generating:
        ttl: 300
      popular:
        ttl: 3600