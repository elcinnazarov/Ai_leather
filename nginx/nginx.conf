events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performans və fayl yükləmə limiti (MinIO şəkilləri üçün 50MB)
    sendfile        on;
    client_max_body_size 50M;
    keepalive_timeout  65;

    # Gzip Sıxılma (Saytın daha sürətli açılması üçün)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ============================================================
    # 1. HTTP (Port 80) -> HTTPS-ə yönləndirmə və Certbot
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name e1000leather.com www.e1000leather.com n8n.e1000leather.com;

        # Let's Encrypt SSL sertifikat doğrulaması üçün
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Bütün trafiki təhlükəsiz HTTPS-ə atır
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # 2. ƏSAS SAYT: e1000leather.com (HTTPS - Port 443)
    # ============================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name e1000leather.com www.e1000leather.com;

        # SSL Sertifikat yolları (Certbot tərəfindən idarə olunur)
        ssl_certificate /etc/letsencrypt/live/e1000leather.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/e1000leather.com/privkey.pem;

        # Proksi Başlıqları (Cloudflare və Real IP məlumatları)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # 🟢 A. BACKEND API SORĞULARI -> Spring Boot-a gedir
        location /api/ {
            proxy_pass http://backend:8080;
        }

        # 🟢 B. MINIO MEDİA (Problem 2-nin Həlli: Videolar və Şəkillər)
        location ~ ^/(ui-videos|customer-experiences|ai-atelye-storage)/ {
            proxy_pass http://minio:9000;
        }

        # 🟢 C. FRONTEND (Problem 3-ün Həlli: React SPA və F5 Refresh)
        location / {
            proxy_pass http://frontend:80;
        }
    }

    # ============================================================
    # 3. N8N SUBDOMENİ: n8n.e1000leather.com (HTTPS - Port 443)
    # ============================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name n8n.e1000leather.com;

        ssl_certificate /etc/letsencrypt/live/e1000leather.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/e1000leather.com/privkey.pem;

        location / {
            proxy_pass http://n8n:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket dəstəyi (n8n üçün mütləqdir)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}